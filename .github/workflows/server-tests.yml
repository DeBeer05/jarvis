name: Headless server tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    name: Server tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: ./.venv/bin/python
          - os: ubuntu-24.04-arm
            python: ./.venv/bin/python
          - os: windows-latest
            python: ./.venv/Scripts/python.exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: '3.12'
      - name: Isolated environment
        run: python -m venv .venv
      - name: Update pinned installer
        run: ${{ matrix.python }} -m pip install --upgrade -c constraints-server.txt pip
      - name: Install minimal server and tests
        run: ${{ matrix.python }} -m pip install -r requirements-server-dev.txt
      - name: Validate dependencies
        run: ${{ matrix.python }} -m pip check
      - name: Verify ARM64 inference wheels without downloading models
        if: matrix.os == 'ubuntu-24.04-arm'
        run: >-
          ${{ matrix.python }} -m pip install --dry-run --ignore-installed --only-binary=:all: -r requirements-voice-server.txt
      - name: Lint and type-check natural conversation
        run: ${{ matrix.python }} scripts/check_natural_quality.py
      - name: Validate Android settings contract
        run: ${{ matrix.python }} scripts/export_natural_contract.py --check
      - name: Validate webchat JavaScript
        run: |
          node --check server/static/chat.js
          node --check server/static/auth.js
          node --check server/static/login.js
          node --check server/static/security.js
      - name: Run server tests
        run: ${{ matrix.python }} -m pytest -q
      - name: Exercise Windows PowerShell 5.1 control scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./scripts/Initialize-ServerEnvironment.ps1
          try {
            & ./scripts/Start-Server.ps1 -Background
            & ./scripts/Get-ServerStatus.ps1
            $health = Invoke-RestMethod http://127.0.0.1:8765/health
            $ready = Invoke-RestMethod http://127.0.0.1:8765/ready
            if ($health.status -ne 'ok' -or $ready.status -ne 'ready') { throw 'API not ready' }
          } finally {
            & ./scripts/Stop-Server.ps1
          }
      - name: Exercise PowerShell 7 control scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./scripts/Initialize-ServerEnvironment.ps1
          try {
            & ./scripts/Start-Server.ps1 -Background
            & ./scripts/Get-ServerStatus.ps1
            $health = Invoke-RestMethod http://127.0.0.1:8765/health -NoProxy
            $ready = Invoke-RestMethod http://127.0.0.1:8765/ready -NoProxy
            if ($health.status -ne 'ok' -or $ready.status -ne 'ready') { throw 'API not ready' }
          } finally {
            & ./scripts/Stop-Server.ps1
          }
